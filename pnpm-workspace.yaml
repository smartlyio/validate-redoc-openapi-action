engineStrict: true

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - "@smartly/*"
  # Renovate security update: redoc@2.4.0
  - redoc@2.4.0

strictDepBuilds: true

allowBuilds:
  # Thanks/telemetry banner only; not a native compile.
  core-js: false

blockExoticSubdeps: true

# Avoid silent reinstalls at runtime (Yarn had no equivalent).
verifyDepsBeforeRun: false

# Non-TTY CI: pnpm 11 otherwise prompts before purging node_modules.
confirmModulesPurge: false
